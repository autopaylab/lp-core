version: 2
updates:
  # One grouped PR a week per ecosystem, so CI runs once, not once per package.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    # The git dependencies are bumped by hand, to a release tag. Dependabot
    # cannot order git tags and has proposed a downgrade.
    ignore:
      - dependency-name: "@autopaylab/*"
    groups:
      all-npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns: ["*"]
